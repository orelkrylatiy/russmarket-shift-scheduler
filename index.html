<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>График смен</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#202124;font-family:Arial,sans-serif}.app{padding:clamp(18px,4vw,42px)}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.head h1{margin:0 0 8px;font-size:clamp(25px,4vw,42px)}.head p{margin:0;color:#71809b}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #d6deeb;border-radius:8px;background:#fff;padding:10px 14px;cursor:pointer;font-weight:600}.button.primary{background:#3f63f3;color:#fff;border-color:#3f63f3}.scroll{overflow:auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px #22304a12}table{min-width:850px;width:100%;border-collapse:collapse;font-size:13px}th,td{min-width:110px;padding:12px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}th:first-child,td:first-child{min-width:170px;position:sticky;left:0;background:#fff;z-index:1}th{color:#59667b;font-size:12px;white-space:nowrap}.cell{min-height:58px;cursor:pointer}.shift{width:100%;text-align:left;border:0;border-left:3px solid #4d6df3;border-radius:6px;background:#edf2ff;color:#3157c9;padding:8px;cursor:pointer}.shift b,.shift span{display:block}.shift span{color:#6f7c91;font-size:11px;margin-top:4px}.empty{color:#bdc6d4;text-align:center;padding:15px;border-radius:6px}.empty:hover{background:#f6f8ff}.toast{position:fixed;right:20px;bottom:20px;background:#182338;color:#fff;padding:12px 16px;border-radius:8px;display:none}@media(max-width:650px){.head{display:block}.actions{margin-top:16px}.button{flex:1}.scroll{border-radius:8px}th,td{padding:10px}.app{padding:18px 12px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
(()=>{const employees=['Анна Смирнова','Иван Петров','Мария Кузнецова','Алексей Орлов','Ольга Волкова'];const days=[['2024-06-03','Пн 3 июн'],['2024-06-04','Вт 4 июн'],['2024-06-05','Ср 5 июн'],['2024-06-06','Чт 6 июн'],['2024-06-07','Пт 7 июн'],['2024-06-08','Сб 8 июн'],['2024-06-09','Вс 9 июн']];const seed=[['Анна Смирнова','2024-06-03','Утренняя','09:00','18:00','blue'],['Анна Смирнова','2024-06-05','Утренняя','09:00','18:00','blue'],['Иван Петров','2024-06-04','Вечерняя','14:00','23:00','purple'],['Иван Петров','2024-06-06','Вечерняя','14:00','23:00','purple'],['Мария Кузнецова','2024-06-03','Дневная','10:00','19:00','green'],['Алексей Орлов','2024-06-07','Утренняя','09:00','18:00','blue']];let shifts=JSON.parse(localStorage.getItem('russmarket-shifts')||'null')||seed.map((x,i)=>({id:i+1,employee:x[0],date:x[1],kind:x[2],start:x[3],end:x[4],color:x[5]}));const app=document.getElementById('app'),toast=document.getElementById('toast');function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1600)}function save(){localStorage.setItem('russmarket-shifts',JSON.stringify(shifts));notify('Сохранено')}function cell(e,d){return shifts.filter(s=>s.employee===e&&s.date===d)}function ask(e,d,s){const kind=prompt('Тип смены: Утренняя, Дневная или Вечерняя',s?.kind||'Утренняя');if(kind===null)return;const start=prompt('Начало',s?.start||'09:00');if(start===null)return;const end=prompt('Окончание',s?.end||'18:00');if(end===null)return;if(s){s.kind=kind;s.start=start;s.end=end}else shifts.push({id:Date.now(),employee:e,date:d,kind,start,end,color:kind==='Вечерняя'?'purple':kind==='Дневная'?'green':'blue'});save();render()}function remove(s){if(confirm('Удалить смену?')){shifts=shifts.filter(x=>x.id!==s.id);save();render()}}function render(){app.innerHTML='<main class="app"><div class="head"><div><h1>График смен сотрудников</h1><p>3 — 9 июня 2024 · Нажмите на смену для редактирования</p></div><div class="actions"><button class="button" id="template">Применить шаблон</button><button class="button primary" id="add">＋ Добавить смену</button></div></div><div class="scroll"><table><thead><tr><th>Сотрудник</th>'+days.map(d=>'<th>'+d[1]+'</th>').join('')+'</tr></thead><tbody>'+employees.map(e=>'<tr><td>'+e+'</td>'+days.map(d=>'<td><div class="cell" data-e="'+e+'" data-d="'+d[0]+'">'+(cell(e,d[0]).map(s=>'<button class="shift" data-id="'+s.id+'"><b>'+s.kind+'</b><span>'+s.start+' — '+s.end+'</span></button>').join('')||'<div class="empty">＋</div>')+'</div></td>').join('')+'</tr>').join('')+'</tbody></table></div></main>';document.querySelectorAll('.cell').forEach(c=>c.onclick=ev=>{const s=shifts.find(x=>x.id==ev.target.closest('.shift')?.dataset.id);if(s&&ev.target.closest('.shift')){if(confirm('Изменить смену? Нажмите «Отмена» для удаления'))ask(s.employee,s.date,s);else remove(s)}else ask(c.dataset.e,c.dataset.d)});document.getElementById('add').onclick=()=>ask(employees[0],days[0][0]);document.getElementById('template').onclick=()=>{employees.forEach((e,i)=>shifts.push({id:Date.now()+i,employee:e,date:days[(i+1)%5][0],kind:'Дневная',start:'10:00',end:'19:00',color:'green'}));save();render()}}render()})();
</script><script type="module" src="/src/main.ts"></script></body></html>
